name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.4, terraform_wrapper: false }
      - run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ >/dev/null && helm repo update >/dev/null
          helm search repo metrics-server/metrics-server -l | head -3
          for i in python:3.12.12-slim-bookworm python:3.12-slim-bookworm grafana/k6:2.3.0 grafana/k6:1.3.0 otel/opentelemetry-collector-contrib:0.162.0; do echo "$i $(docker manifest inspect $i >/dev/null 2>&1 && echo OK || echo MISSING)"; done
          curl -s 'https://hub.docker.com/v2/repositories/library/python/tags?page_size=100&name=3.12.' | jq -r '.results[].name' | grep -E '^3\.12\.[0-9]+-slim' | sort -V | tail -4
          mkdir t && cd t && cat > main.tf <<'TF'
          terraform {
            required_providers {
              kind = { source = "tehcyx/kind", version = "0.11.0" }
              helm = { source = "hashicorp/helm", version = "3.3.0" }
              kubernetes = { source = "hashicorp/kubernetes", version = "3.3.0" }
            }
          }
          TF
          terraform init -no-color >/dev/null
          terraform providers schema -json > s.json
          jq -c '.provider_schemas["registry.terraform.io/tehcyx/kind"].resource_schemas.kind_cluster.block | {a: (.attributes|keys), b: (.block_types|keys)}' s.json
          jq -c '.provider_schemas["registry.terraform.io/tehcyx/kind"].resource_schemas.kind_cluster.block.block_types.kind_config.block | {a: (.attributes|keys), b: (.block_types|keys)}' s.json
          jq -c '.provider_schemas["registry.terraform.io/tehcyx/kind"].resource_schemas.kind_cluster.block.block_types.kind_config.block.block_types.node.block | {a: (.attributes|keys), b: (.block_types|keys)}' s.json
          jq -c '.provider_schemas["registry.terraform.io/hashicorp/helm"].provider | {a: (.block.attributes|keys), b: (.block.block_types|keys)}' s.json
          jq -c '.provider_schemas["registry.terraform.io/hashicorp/helm"].provider.block.attributes.kubernetes' s.json | head -c 1500; echo
          jq -c '.provider_schemas["registry.terraform.io/hashicorp/helm"].resource_schemas.helm_release.block | {a: (.attributes|keys), b: (.block_types|keys)}' s.json
          jq -c '.provider_schemas["registry.terraform.io/hashicorp/kubernetes"].resource_schemas | keys' s.json | tr ',' '\n' | grep -E 'namespace|config_map|"kubernetes_manifest' 
