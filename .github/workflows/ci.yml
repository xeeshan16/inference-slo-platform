name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.6
  PROMETHEUS_VERSION: 3.5.0
  KUBECONFORM_VERSION: 0.6.7

jobs:
  service:
    name: service (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app training tests
      - run: pytest

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff terraform
      - name: validate environments
        run: |
          for env in local aws; do
            echo "::group::$env"
            terraform -chdir=terraform/environments/$env init -backend=false -input=false
            terraform -chdir=terraform/environments/$env validate
            echo "::endgroup::"
          done

  manifests:
    name: manifests (helm, kubeconform, promtool, dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install promtool and kubeconform
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: SLO rules (promtool)
        run: |
          promtool check rules charts/inference-service/files/slo-rules.yaml
          promtool test rules charts/inference-service/tests-promtool/slo-rules.test.yaml
      - name: helm lint
        run: helm lint --strict charts/inference-service
      - name: kubeconform (default values and every values-*.yaml overlay)
        run: |
          for values in charts/inference-service/values.yaml charts/inference-service/values-*.yaml; do
            [ -f "$values" ] || continue
            echo "::group::$values"
            helm template inference-service charts/inference-service -n inference -f "$values" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: k6 job manifest
        run: |
          SCENARIO=steady RATE=1 PEAK=1 DURATION=1s BATCH=1 RUN_ID=check envsubst < loadtest/job.yaml.tpl \
            | kubeconform -strict -summary
      - name: dashboard JSON
        run: |
          jq -e '.uid == "inference-slo" and (.panels | length) > 10' terraform/modules/app/dashboards/inference-slo.json
      - name: scripts
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py

  image:
    name: image (docker build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t inference-service:ci service
      - name: image size and smoke test
        run: |
          docker image ls inference-service:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker run -d --name svc -p 8080:8080 --read-only --tmpfs /tmp -e TELEMETRY_ENABLED=false inference-service:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          python3 -c 'import json;print(json.dumps({"instances":[[0]*64]}))' > /tmp/body.json
          curl -sf -XPOST localhost:8080/predict -H 'content-type: application/json' --data @/tmp/body.json
          echo
          docker logs svc | tail -5
          docker rm -f svc
