[project]
name = "inference-service"
version = "1.0.0"
description = "Small CPU inference service (digits classifier, ONNX Runtime) instrumented with OpenTelemetry."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sklearn.*", "skl2onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
